spring.application.name=kaffebar-api-solution

# Utelat null-felt fra JSON. Uten denne kommer valgfrie felt ut som
# "milkType": null, mens referanse-implementasjonen i 4-Frontend utelater dem helt.
# Begge er gyldige etter kontrakten, men like svar er lettere å diffe.
spring.jackson.default-property-inclusion=non_null

# --- Valgfritt siste steg: hendelser til RabbitMQ. AV som standard. ------------
# Skru på med --kaffebar.events.enabled=true. Se FASIT.md.
kaffebar.events.enabled=false
kaffebar.events.exchange=kaffebar
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Auto-barista: flytter ordrer videre av seg selv. Også AV som standard.
kaffebar.barista.auto-enabled=false
kaffebar.barista.interval-ms=8000

# springdoc serverer kontrakten på /v3/api-docs og Swagger-UI på /swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
